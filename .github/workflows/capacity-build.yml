name: Build capacity table (temporary)

# TEMPORARY scaffolding, deleted once capacities.json is in the repo. Runs
# on push and commits the result, because the environment this was authored
# in cannot reach the inventory -- the run is the only way to produce the
# file, and an artifact download would be equally unreachable.
on:
  push:
    branches: ["claude/reservoir-updates-trends-xpg4nj"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install "requests==2.*" "pandas==3.0.*" "numpy==2.*"
      - name: Build capacities.json from NID
        env:
          PYTHONUNBUFFERED: "1"
        run: python tools/build_capacity_table.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add capacities.json
          if git diff --cached --quiet; then
            echo "No capacity changes."
            exit 0
          fi
          git commit -m "Build capacity table from the National Inventory of Dams"
          git push
