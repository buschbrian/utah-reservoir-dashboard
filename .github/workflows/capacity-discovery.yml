name: Capacity discovery (temporary)

# TEMPORARY scaffolding, deleted once a capacity source is chosen. Runs on
# push because workflow_dispatch can only target workflows that already
# exist on the default branch, and the whole point is to run this before
# anything lands there.
on:
  push:
    branches: ["claude/reservoir-updates-trends-xpg4nj"]

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install "requests==2.*" "pandas==3.0.*" "numpy==2.*"
      - name: Find Utah capacity datasets
        env:
          PYTHONUNBUFFERED: "1"
        run: python tools/find_utah_capacities.py
