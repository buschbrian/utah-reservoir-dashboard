name: CI

# Runs on every push and PR. Neither of these jobs existed before, which is
# why a page that rendered zero reservoirs could ship green: nothing checked
# the data script's behavior, and nothing ever loaded the dashboards.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-tests:
    name: Modernization typecheck, unit tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      # Split into three steps rather than one `npm run build`: this job runs
      # on every daily data refresh, and when it goes red the step name is
      # the whole diagnosis -- a type error, a broken parity assertion
      # against shared/reservoir-viz.js, or a bundling failure are three
      # different mornings.
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: SDK bundle budget
        run: npm run budget:sdk
      - name: Production build
        run: npx vite build

  python-tests:
    name: Data script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements-test.txt
      - name: Run tests
        run: python -m pytest tests/ -v

  browser-smoke:
    name: Dashboard smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies and build the published pages
        run: |
          npm ci
          npx vite build
      - name: Install Playwright
        run: |
          # Browser-only test dependency; the application dependency graph
          # remains exactly what npm ci installed from the lockfile.
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Check retired route redirects in a real browser
        run: |
          mkdir -p screenshots
          node tests/smoke.mjs
      # Separate step, and separate file: this one covers the complete primary
      # ArcGIS application rather than the three small compatibility routes.
      - name: Load the primary ArcGIS application in a real browser
        run: node tests/smoke-modern.mjs
      # Uploaded on failure *and* success: when a map breaks, the picture is
      # usually the fastest explanation, and when it doesn't, it is the only
      # visual record that the symbology still looks right.
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-screenshots
          path: screenshots/
          if-no-files-found: warn
