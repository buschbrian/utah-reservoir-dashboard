name: Probe RISE catalog

# Manual-only diagnostic. Prints what RISE publishes about a reservoir
# beyond its storage timeseries, so catalog work can be written against the
# real payload rather than a guess about the API's shape.
#
# Manual only. Note that workflow_dispatch can only target a workflow that
# already exists on the default branch -- until this lands on main, the only
# way to run it is a temporary `push:` trigger on your branch.
on:
  workflow_dispatch:
    inputs:
      name:
        description: "Reservoir name (must match a key in RESERVOIRS)"
        required: false
        default: "Lake Powell"
      dump:
        description: "Also print full payloads"
        type: boolean
        default: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install "requests==2.*" "pandas==3.0.*" "numpy==2.*"
      - name: Probe
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          NAME="${{ inputs.name }}"
          python tools/probe_rise.py --name "${NAME:-Lake Powell}"
