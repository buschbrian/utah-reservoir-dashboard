name: Probe RISE catalog

# Manual-only diagnostic. Prints what RISE publishes about a reservoir
# beyond its storage timeseries, so catalog work can be written against the
# real payload rather than a guess about the API's shape.
#
# TEMPORARY: also runs on pushes to the capacity branch. workflow_dispatch
# can only target a workflow that already exists on the default branch, and
# this one doesn't yet -- so until it lands on main, a push is the only way
# to run it. Drop the `push:` trigger once the capacity work is done.
on:
  push:
    branches: ["claude/reservoir-updates-trends-xpg4nj"]
  workflow_dispatch:
    inputs:
      name:
        description: "Reservoir name (must match a key in RESERVOIRS)"
        required: false
        default: "Lake Powell"
      dump:
        description: "Also print full payloads"
        type: boolean
        default: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install "requests==2.*" "pandas==3.0.*" "numpy==2.*"
      - name: Probe
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          NAME="${{ inputs.name }}"
          python tools/probe_rise.py --name "${NAME:-Lake Powell}" --capacity-hunt
