name: Refresh reservoir data

on:
  schedule:
    # 12:00 UTC = 6am Mountain Time (MDT, UTC-6). Drifts to 5am during
    # standard time (MST, UTC-7) since GitHub Actions cron doesn't adjust
    # for DST -- acceptable for a daily, non-time-critical data refresh.
    # (The script itself no longer depends on this: it computes "today" in
    # Mountain Time regardless of when the run fires.)
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write # so the run can open and close its own staleness issue

# A scheduled run and a manual run overlapping would have both jobs pushing
# reservoirs.json from the same base commit; the second push then fails on a
# non-fast-forward.
concurrency:
  group: refresh-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Pinned deliberately. These were unpinned, which means the daily job
      # silently picks up major releases -- pandas 3.0 changed groupby.apply
      # semantics and deprecated Timestamp.utcnow(), either of which would
      # have broken the refresh on whatever morning it happened to land.
      - name: Install dependencies
        run: pip install -r requirements-pipeline.txt

      # Self-healing attempt #1: a transient RISE outage should cost the run
      # a few minutes, not a day of data. The script already retries each
      # HTTP request, but a failure that takes down the whole run (RISE down
      # for a minute, more than half the reservoirs unreachable) needs a
      # retry at this level too. Three attempts, backing off 1/3/9 minutes,
      # all well inside the daily cadence.
      - name: Pull fresh reservoir data
        id: refresh
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          for attempt in 1 2 3; do
            echo "::group::Refresh attempt $attempt"
            if python refresh_reservoirs.py; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            if [ "$attempt" -lt 3 ]; then
              delay=$((60 * 3 ** (attempt - 1)))
              echo "::warning title=Refresh retry::Attempt $attempt failed; retrying in ${delay}s"
              sleep "$delay"
            fi
          done
          echo "::error title=Refresh failed::All 3 attempts failed; reservoirs.json left untouched"
          exit 1

      # The Drought Monitor changes weekly. A service interruption must not
      # block current reservoir readings, so keep the last verified polygons
      # when this independent download fails.
      - name: Pull current drought polygons
        run: |
          if ! python tools/fetch_drought_monitor.py; then
            echo "::warning title=Drought download failed::Keeping the last verified GeoJSON"
          fi

      # The two drought files have to describe the same week in the same
      # commit, and this step is the reason they do.
      #
      # The polygons were being fetched here from the day this job learned
      # about drought, but the coverage figures the drought view actually
      # renders were only ever recomputed by hand. So the first Thursday the
      # monitor published, this job would commit new polygons beside week-old
      # coverage -- and the drought view refuses to draw that mismatch by
      # design, because two files describing two different weeks is a
      # pipeline fault a reader must not have to notice. Worse, the deploy
      # chains off *this* workflow completing rather than off CI passing, so
      # the broken pair would go live and CI would only turn red afterwards.
      #
      # The recompute is deterministic, carries no timestamps and takes about
      # two seconds for all fourteen units, so it runs every day rather than
      # only when the download reports a change: a coverage file that somehow
      # fell behind is then repaired by the next run instead of waiting for
      # someone to notice.
      - name: Recompute drought coverage by drainage area
        run: |
          if ! python tools/compute_drought_coverage.py; then
            echo "::warning title=Coverage failed::Reverting the polygons so the pair stays on one week"
            git checkout -- data/drought/usdm-current.geojson
          fi

      # Belt and braces, and cheap. If the two files disagree for any reason
      # this step has not thought of, both are put back to the last commit
      # where they agreed. Publishing yesterday's drought week is a small,
      # honest loss; publishing two different weeks is a broken page.
      - name: Refuse to publish two different drought weeks
        run: |
          if ! python tools/check_drought_pair.py; then
            echo "::warning title=Drought pair mismatched::Restoring both files from the last commit"
            git checkout -- data/drought/usdm-current.geojson data/drought/usdm-huc6.json
          fi

      # Snow measurements have their own payload and failure mode. The
      # reviewed inventory is committed; a short provider response is retried
      # one station at a time and never replaces the last complete file.
      - name: Pull current snow measurements
        run: |
          if ! python refresh_snowpack.py; then
            echo "::warning title=Snow download failed::Keeping the last complete snow payload"
          fi

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Both drought files or neither: the steps above guarantee they
          # agree, and staging them together is what keeps that true of the
          # commit as well as of the working tree.
          git add reservoirs.json snow_sites.json snowpack.json \
            data/drought/usdm-current.geojson data/drought/usdm-huc6.json
          if git diff --cached --quiet; then
            echo "No data changes today."
            exit 0
          fi
          git commit -m "Daily reservoir data refresh"
          # The push can lose a race with another workflow committing to the
          # same branch; rebase and retry rather than failing the run and
          # throwing away a good pull.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push rejected (attempt $attempt); rebasing onto the remote."
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            sleep $((attempt * 5))
          done
          exit 1

      # The monitor publishes each Thursday. When it does not, nothing in
      # this job fails -- the last verified week is still on the page, marked
      # with its age -- so the only way anyone finds out is if someone looks.
      # This is the same self-healing issue pattern the stale-feed alert
      # uses: it opens when the release is late, updates while it stays late,
      # and closes itself when a new map arrives.
      - name: Check the drought release age
        id: drought_age
        run: python tools/check_drought_pair.py --github-output

      - name: Open or update the late-drought issue
        if: steps.drought_age.outputs.late == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DAYS: ${{ steps.drought_age.outputs.days_old }}
          RELEASE: ${{ steps.drought_age.outputs.release_date }}
          MAP_WEEK: ${{ steps.drought_age.outputs.map_date }}
        run: |
          TITLE="The Drought Monitor has not published for $DAYS days"
          {
            printf '%s\n\n' "The newest drought map this project holds describes the week of **$MAP_WEEK** and was released on **$RELEASE**, which is **$DAYS** days ago."
            printf '%s\n\n' "A new map is normally published every Thursday. The drought page keeps showing this one and states its age, so nothing is presented as more current than it is -- but the figures stop tracking conditions on the ground while this is open."
            printf '%s\n\n' "Check the producer at https://droughtmonitor.unl.edu/ before assuming this is a fault in this pipeline."
            printf '%s\n' "Last checked $(date -u '+%Y-%m-%d %H:%M UTC') · [refresh run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          } > drought-issue.md
          gh label create late-drought --color 730000 \
            --description 'The U.S. Drought Monitor has missed its weekly release' 2>/dev/null || true
          EXISTING=$(gh issue list --state open --label late-drought --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --title "$TITLE" --body-file drought-issue.md
          else
            gh issue create --title "$TITLE" --body-file drought-issue.md --label late-drought
          fi

      - name: Close the late-drought issue once a new map arrives
        if: steps.drought_age.outputs.late == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          MAP_WEEK: ${{ steps.drought_age.outputs.map_date }}
        run: |
          EXISTING=$(gh issue list --state open --label late-drought --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --comment "A drought map for the week of $MAP_WEEK is published and the coverage figures were recomputed from it. Closing automatically."
          fi

      # Self-healing attempt #2: the staleness alert manages its own issue.
      # An open issue is the state "some feed is quiet"; the run closes it as
      # soon as that stops being true, so nobody has to remember to. This is
      # the part that turns a warning on a page nobody reads into something
      # that arrives on its own and goes away on its own.
      - name: Open or update the stale-feed issue
        if: steps.refresh.outputs.stale_count != '0' && steps.refresh.outputs.stale_count != ''
        env:
          GH_TOKEN: ${{ github.token }}
          STALE_COUNT: ${{ steps.refresh.outputs.stale_count }}
          STALE_NAMES: ${{ steps.refresh.outputs.stale_names }}
          STALE_TABLE: ${{ steps.refresh.outputs.stale_table }}
        run: |
          TITLE="Reservoir feeds have gone quiet ($STALE_NAMES)"
          # Built with printf into a file rather than an inline heredoc: a
          # heredoc indented to match this YAML block would carry those
          # spaces into the issue body, and four leading spaces is a Markdown
          # code block.
          {
            printf '%s\n\n' "The refresh found **$STALE_COUNT** reservoir(s) later than their expected source cadence."
            printf '%s\n\n' "$STALE_TABLE"
            printf '%s\n\n' "A reservoir lands here when its newest reading exceeds its cadence threshold (2 days for daily data; 45 days for month-end data), or when the refresh cannot reach its source. Its last known value is still published and drawn on the map, marked stale — it is not presented as current."
            printf '%s\n\n' "This issue is maintained automatically: it updates on every refresh and closes itself once every feed is reporting again."
            printf '%s\n' "Last checked $(date -u '+%Y-%m-%d %H:%M UTC') · [refresh run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          } > issue-body.md
          gh label create stale-feed --color b45309 \
            --description 'A reservoir source stopped reporting on its expected cadence' 2>/dev/null || true
          EXISTING=$(gh issue list --state open --label stale-feed --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --title "$TITLE" --body-file issue-body.md
            echo "Updated issue #$EXISTING"
          else
            gh issue create --title "$TITLE" --body-file issue-body.md --label stale-feed
          fi

      - name: Close the stale-feed issue once every feed recovers
        if: steps.refresh.outputs.stale_count == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTING=$(gh issue list --state open --label stale-feed --limit 1 --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --comment "All reservoir feeds are reporting again as of $(date -u '+%Y-%m-%d'). Closing automatically."
            echo "Closed issue #$EXISTING"
          else
            echo "All feeds fresh, no open issue."
          fi
