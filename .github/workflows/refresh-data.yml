name: Refresh reservoir data

# What this workflow does is in scripts/refresh-daily.sh, and what its issues
# say is in tools/feed_issue_report.py. Both are runnable and tested locally.
# What stays here is what only GitHub can do: when to run, what the run may
# touch, and the `gh` calls that maintain the three self-healing issues.
#
# See docs/operations/data-refresh.md.

on:
  schedule:
    # 12:00 UTC = 6am Mountain Time (MDT, UTC-6). Drifts to 5am during
    # standard time since GitHub Actions cron doesn't adjust for DST --
    # acceptable for a daily, non-time-critical data refresh. The script
    # computes "today" in Mountain Time regardless of when the run fires.
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write # so the run can open and close its own staleness issues

# A scheduled run and a manual run overlapping would have both jobs pushing
# reservoirs.json from the same base commit; the second push then fails on a
# non-fast-forward.
concurrency:
  group: refresh-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Pinned deliberately. Unpinned, the daily job silently picks up major
      # releases -- pandas 3.0 changed groupby.apply semantics and deprecated
      # Timestamp.utcnow(), either of which would have broken the refresh on
      # whatever morning it happened to land.
      - name: Install dependencies
        run: pip install -r requirements-pipeline.txt

      # Every stage, its retries, its reverts and the published file list.
      # `id: refresh` is still how the issue steps below read the counts:
      # refresh_reservoirs.py writes them to $GITHUB_OUTPUT itself.
      - name: Refresh, verify and commit the published data
        id: refresh
        env:
          PYTHONUNBUFFERED: "1"
        run: scripts/refresh-daily.sh

      # The monitor publishes each Thursday. When it does not, nothing above
      # fails -- the last verified week is still on the page, marked with its
      # age -- so the only way anyone finds out is if someone looks.
      - name: Check the drought release age
        id: drought_age
        run: python tools/check_drought_pair.py --github-output

      - name: Open or update the late-drought issue
        if: steps.drought_age.outputs.late == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DAYS: ${{ steps.drought_age.outputs.days_old }}
          RELEASE: ${{ steps.drought_age.outputs.release_date }}
          MAP_WEEK: ${{ steps.drought_age.outputs.map_date }}
        # Values reach the shell through the environment rather than through
        # ${{ }} interpolation: a reservoir name or a table row carrying a
        # quote would otherwise be pasted into the command line.
        run: |
          TITLE=$(python tools/feed_issue_report.py drought \
            --days "$DAYS" --release "$RELEASE" --map-week "$MAP_WEEK" \
            --body-file drought-issue.md)
          scripts/gh-selfhealing-issue.sh open drought "$TITLE" drought-issue.md

      - name: Close the late-drought issue once a new map arrives
        if: steps.drought_age.outputs.late == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          MAP_WEEK: ${{ steps.drought_age.outputs.map_date }}
        run: |
          scripts/gh-selfhealing-issue.sh close drought \
            "A drought map for the week of $MAP_WEEK is published and the coverage figures were recomputed from it. Closing automatically."

      # An open issue is the state "some feed is quiet"; the run closes it as
      # soon as that stops being true, so nobody has to remember to.
      - name: Open or update the stale-feed issue
        if: steps.refresh.outputs.stale_count != '0' && steps.refresh.outputs.stale_count != ''
        env:
          GH_TOKEN: ${{ github.token }}
          STALE_COUNT: ${{ steps.refresh.outputs.stale_count }}
          STALE_NAMES: ${{ steps.refresh.outputs.stale_names }}
          STALE_TABLE: ${{ steps.refresh.outputs.stale_table }}
        run: |
          TITLE=$(python tools/feed_issue_report.py stale \
            --count "$STALE_COUNT" --names "$STALE_NAMES" --table "$STALE_TABLE" \
            --body-file issue-body.md)
          scripts/gh-selfhealing-issue.sh open stale "$TITLE" issue-body.md

      - name: Close the stale-feed issue once every feed recovers
        if: steps.refresh.outputs.stale_count == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/gh-selfhealing-issue.sh close stale \
            "All reservoir feeds are reporting again as of $(date -u '+%Y-%m-%d'). Closing automatically."

      # Withdrawal gets its own issue rather than a section in the one above,
      # because it is a different fact with a different remedy. Stale is "watch
      # this"; withdrawn is "this reservoir left the map, and someone has to
      # decide whether the feed is coming back or the reservoir needs
      # re-sourcing".
      - name: Open or update the withdrawn-feed issue
        if: steps.refresh.outputs.withdrawn_count != '0' && steps.refresh.outputs.withdrawn_count != ''
        env:
          GH_TOKEN: ${{ github.token }}
          WITHDRAWN_COUNT: ${{ steps.refresh.outputs.withdrawn_count }}
          WITHDRAWN_NAMES: ${{ steps.refresh.outputs.withdrawn_names }}
          WITHDRAWN_TABLE: ${{ steps.refresh.outputs.withdrawn_table }}
        run: |
          TITLE=$(python tools/feed_issue_report.py withdrawn \
            --count "$WITHDRAWN_COUNT" --names "$WITHDRAWN_NAMES" --table "$WITHDRAWN_TABLE" \
            --body-file withdrawn-body.md)
          scripts/gh-selfhealing-issue.sh open withdrawn "$TITLE" withdrawn-body.md

      - name: Close the withdrawn-feed issue once every reservoir is back in range
        if: steps.refresh.outputs.withdrawn_count == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/gh-selfhealing-issue.sh close withdrawn \
            "Every reservoir is inside the publication window again as of $(date -u '+%Y-%m-%d'), and all are published. Closing automatically."
