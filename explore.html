<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- Measured, not guessed: every source is a host the running application
       was observed to contact by tools/audit-transfer.mjs, and the whole
       browser suite runs against these pages with this policy in place --
       including the basemap fallback chain, which reaches hosts the happy
       path never does.

       Be clear about what this does and does not buy. `script-src` is
       permissive by necessity and was arrived at by measurement, not
       preference: the SDK starts workers that import their own code from its
       CDN, and the charts package compiles JSON schemas with `new Function`.
       Both were confirmed by removing them and watching the pages fail --
       without the CDN the charts workspace never finishes loading at all.
       So this is not meaningful protection against injected script.

       What it does buy is real and separate: no plugins, no injected `base`
       tag redirecting relative URLs, no form posting anywhere, and every
       fetch, image and font restricted to this origin and named Esri hosts.
       An injected `img` or `fetch` cannot exfiltrate to an attacker's host.

       A `meta` policy cannot express `frame-ancestors`, `report-uri` or
       `sandbox` -- those are header-only and GitHub Pages serves no custom
       headers -- so this is the enforceable subset for a static host. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'none'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval' blob: https://*.arcgis.com https://*.arcgisonline.com; worker-src 'self' blob: https://*.arcgis.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.arcgis.com https://*.arcgisonline.com; font-src 'self' data: https://*.arcgis.com; connect-src 'self' https://*.arcgis.com https://*.arcgisonline.com" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="refresh" content="1; url=./overview.html" />
  <link vite-ignore rel="canonical" href="./overview.html" />
  <title>Charts moved — Utah Reservoir Dashboard</title>
  <style>
    body { margin: 0; color: #2f342f; background: #f3eee6; font: 1rem/1.6 system-ui, sans-serif; }
    main { width: min(36rem, calc(100% - 2rem)); margin: 12vh auto 0; padding: 1.25rem; background: #fffaf2; border: 1px solid #d4c5b2; border-radius: .65rem; }
    h1 { margin-block-start: 0; font-size: 1.5rem; }
    a { color: #28575b; }
  </style>
  <script vite-ignore defer src="./retired-route.js" data-target="./overview.html" data-contract="overview"></script>
</head>
